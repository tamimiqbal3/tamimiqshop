<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tamim Iqbal </title>
    <link rel="icon" href="profile.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="profile.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; background: #050505; color: #fff; 
            font-family: 'Outfit', sans-serif; display: flex; 
            flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* Animated Background */
        .bg-glow { position: fixed; width: 600px; height: 600px; background: radial-gradient(circle, #2d1b4e 0%, transparent 70%); top: -100px; right: -100px; opacity: 0.5; z-index: -1; }

        .header { margin-top: 80px; text-align: center; }
        .header h1 { font-size: 3.5rem; margin: 0; letter-spacing: -1px; }
        .header p { color: #888; font-weight: 300; margin-top: 10px; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; }

        /* Bento Grid */
        .grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 20px; width: 90%; max-width: 1000px; margin-top: 50px; 
        }

        .card { 
            background: rgba(255, 255, 255, 0.03); padding: 30px; border-radius: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.05); text-decoration: none; 
            color: white; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden;
        }
        .card:hover { border-color: #fff; background: rgba(255, 255, 255, 0.07); transform: translateY(-5px); }
        
        .card h3 { margin: 0 0 10px 0; font-size: 1.3rem; }
        .card .link-text { font-size: 0.85rem; color: #777; font-weight: 500; }
        
        /* Premium Badge */
        .badge { background: #fff; color: #000; padding: 4px 10px; border-radius: 50px; font-size: 0.6rem; font-weight: 700; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="header">
        <h1>TAMIM IQBAL</h1>
        <p>Showcasing My Web Development Work</p>
    </div>

    <div class="grid">
        <a href="https://support.tamimiq.shop" class="card">
            <div class="badge">SYSTEM</div>
            <h3>Support Center</h3>
            <span class="link-text">support.tamimiq.shop</span>
        </a>
        <a href="https://maintenance.tamimiq.shop" class="card">
            <div class="badge">PLATFORM</div>
            <h3>Maintenance</h3>
            <span class="link-text">maintenance.tamimiq.shop</span>
        </a>
        <a href="https://learn.tamimiq.shop" class="card">
            <div class="badge">EDUCATION</div>
            <h3>Tamim's Classroom</h3>
            <span class="link-text">learn.tamimiq.shop</span>
        </a>
        <a href="https://rcs200.vercel.app" class="card">
            <div class="badge">LEGACY</div>
            <h3>RCS 200 Years</h3>
            <span class="link-text">rcs200.vercel.app</span>
        </a>
        <a href="https://ngdcsc.vercel.app" class="card">
            <div class="badge">SCIENCE</div>
            <h3>NGDC Science Club</h3>
            <span class="link-text">ngdcsc.vercel.app</span>
        </a>
    </div>
</body>
</html>
